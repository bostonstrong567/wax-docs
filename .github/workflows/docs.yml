name: Deploy docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Read the Pages settings
        id: pages
        uses: actions/configure-pages@v5

      - name: Install
        run: npm ci

      # base_path is /wax-docs for this project site, and empty for a site served from a domain root.
      - name: Build
        run: npm run build
        env:
          DOCS_BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - name: Check links
        run: npm run check
        env:
          DOCS_BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - name: Make sure .nojekyll is in the output
        run: touch out/.nojekyll

      - name: Upload the site
        uses: actions/upload-pages-artifact@v4
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # The same site built without a path prefix, kept on the "site" branch for a server that serves it at its own address.
  site:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Build for the root of a site
        run: npm run build
        env:
          DOCS_BASE_PATH: ""

      - name: Check links
        run: npm run check
        env:
          DOCS_BASE_PATH: ""

      - name: Put the build on the site branch
        run: |
          cd out
          touch .nojekyll
          git init -q -b site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Site build ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" site